<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Physics Lava Lamp Simulation</title>
<style>
  :root {
    --panel: rgba(12, 13, 24, 0.68);
    --panel-border: rgba(255, 214, 128, 0.22);
    --text: #fff3dc;
    --muted: #c8a977;
    --accent: #ff9c2f;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 18%, rgba(79, 31, 87, 0.42), transparent 34%),
      radial-gradient(circle at 50% 105%, rgba(255, 125, 26, 0.20), transparent 34%),
      linear-gradient(180deg, #05050a 0%, #11101f 42%, #07060b 100%);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
  }

  .hud {
    position: fixed;
    left: 18px;
    top: 18px;
    width: min(360px, calc(100vw - 36px));
    padding: 16px 16px 14px;
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    background: var(--panel);
    backdrop-filter: blur(16px);
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.42);
    user-select: none;
  }

  h1 {
    margin: 0 0 6px;
    font-size: 17px;
    line-height: 1.2;
    letter-spacing: 0.02em;
  }

  .note {
    margin: 0 0 14px;
    color: var(--muted);
    font-size: 12.5px;
    line-height: 1.45;
  }

  .grid {
    display: grid;
    gap: 11px;
  }

  label {
    display: grid;
    gap: 6px;
    font-size: 12px;
    color: #ffe1a4;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }

  button {
    appearance: none;
    border: 1px solid rgba(255, 214, 128, 0.32);
    border-radius: 999px;
    padding: 8px 12px;
    color: var(--text);
    background: rgba(255, 156, 47, 0.13);
    cursor: pointer;
    transition: transform 120ms ease, background 120ms ease;
  }

  button:hover {
    background: rgba(255, 156, 47, 0.22);
    transform: translateY(-1px);
  }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 12px;
    margin-top: 12px;
    color: #cfb784;
    font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  .hint {
    margin-top: 12px;
    color: rgba(255, 227, 173, 0.62);
    font-size: 11.5px;
    line-height: 1.35;
  }

  @media (max-width: 700px) {
    .hud {
      left: 12px;
      right: 12px;
      top: 12px;
      width: auto;
      padding: 13px;
    }

    .note,
    .hint {
      display: none;
    }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<section class="hud" aria-label="Lava lamp controls">
  <h1>Physics Lava Lamp</h1>
  <p class="note">
    Each wax blob is a particle parcel with heat exchange, density changes,
    buoyancy, drag, wall forces, coalescence, and splitting. The image is
    rendered from a metaball scalar field.
  </p>

  <div class="grid">
    <label>
      <span class="row"><span>Heater power</span><output id="heatOut">1.00×</output></span>
      <input id="heat" type="range" min="0.55" max="1.65" step="0.01" value="1.00">
    </label>

    <label>
      <span class="row"><span>Fluid viscosity</span><output id="viscOut">1.00×</output></span>
      <input id="viscosity" type="range" min="0.55" max="1.85" step="0.01" value="1.00">
    </label>

    <label>
      <span class="row"><span>Wax parcels</span><output id="countOut">18</output></span>
      <input id="count" type="range" min="8" max="34" step="1" value="18">
    </label>

    <div class="row">
      <button id="pause">Pause</button>
      <button id="reset">Reset wax</button>
    </div>
  </div>

  <div class="stats">
    <span id="statTemp">temp: --</span>
    <span id="statFPS">fps: --</span>
    <span id="statBlob">blobs: --</span>
    <span id="statEnergy">energy: --</span>
  </div>

  <div class="hint">
    Click or tap inside the lamp to inject a warm wax parcel.
  </div>
</section>

<script>
(() => {
  "use strict";

  /*
    PHYSICS MODEL
    -------------
    Coordinates are normalized to the lamp body: x,y in [0,1], with y=0 at
    the cool top and y=1 at the hot base.

    Every blob is a parcel of wax. Its "radius" is a 2D proxy for mass/area.
    Temperature controls density:
      hot wax -> lower density -> upward buoyant acceleration
      cool wax -> higher density -> downward acceleration

    The blob state is integrated with a semi-implicit Euler step:
      1. exchange heat with the local fluid gradient
      2. compute buoyancy from temperature-dependent density
      3. add drag, convection, wall constraints, and soft collisions
      4. integrate velocity then position

    Rendering uses a scalar field:
      field(x,y) = sum(r_i^2 / distance_i^2)
    Pixels above a threshold become lava. This makes separate parcels merge
    visually without needing the geometry of each blob to be meshed.
  */

  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d", { alpha: false });

  const off = document.createElement("canvas");
  const offCtx = off.getContext("2d", { willReadFrequently: true });

  const heatSlider = document.getElementById("heat");
  const viscSlider = document.getElementById("viscosity");
  const countSlider = document.getElementById("count");
  const heatOut = document.getElementById("heatOut");
  const viscOut = document.getElementById("viscOut");
  const countOut = document.getElementById("countOut");
  const pauseButton = document.getElementById("pause");
  const resetButton = document.getElementById("reset");

  const statTemp = document.getElementById("statTemp");
  const statFPS = document.getElementById("statFPS");
  const statBlob = document.getElementById("statBlob");
  const statEnergy = document.getElementById("statEnergy");

  const TAU = Math.PI * 2;
  const rand = (min, max) => min + Math.random() * (max - min);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smoothstep = (a, b, x) => {
    const t = clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  };

  let W = 1;
  let H = 1;
  let DPR = 1;
  let lamp = { x: 0, y: 0, w: 1, h: 1, aspect: 0.42 };
  let imageData = null;

  let blobs = [];
  let paused = false;
  let lastTime = performance.now();
  let fpsSmooth = 60;
  let frame = 0;

  function lampHalfWidth(y) {
    // Bottle radius in normalized x units. Narrow neck, broad warm base.
    let h = 0.265 + 0.045 * Math.sin(Math.PI * clamp(y, 0, 1));
    if (y < 0.18) h = lerp(0.105, h, smoothstep(0.02, 0.18, y));
    if (y > 0.86) h = lerp(h, 0.335, smoothstep(0.86, 1.0, y));
    return h;
  }

  function insideLamp(x, y, radius = 0) {
    if (y < 0.02 + radius || y > 0.985 - radius) return false;
    return Math.abs(x - 0.5) <= lampHalfWidth(y) - radius * 0.55;
  }

  function constrainToLamp(b, dt) {
    const minY = 0.032 + b.r * 0.55;
    const maxY = 0.982 - b.r * 0.55;

    if (b.y < minY) {
      const push = minY - b.y;
      b.vy += push * 42 * dt;
      b.y = minY;
      b.vy *= -0.25;
      b.temp -= 0.012;
    }

    if (b.y > maxY) {
      const push = b.y - maxY;
      b.vy -= push * 48 * dt;
      b.y = maxY;
      b.vy *= -0.18;
      b.temp += 0.015;
    }

    const hw = lampHalfWidth(b.y);
    const pad = b.r * 0.58 + 0.006;
    const left = 0.5 - hw + pad;
    const right = 0.5 + hw - pad;

    if (b.x < left) {
      const push = left - b.x;
      b.vx += push * 54 * dt;
      b.x = left;
      b.vx *= -0.26;
    }

    if (b.x > right) {
      const push = b.x - right;
      b.vx -= push * 54 * dt;
      b.x = right;
      b.vx *= -0.26;
    }
  }

  function localFluidTemperature(x, y, t) {
    // Stable vertical thermal gradient plus a moving convection shimmer.
    const bottomHeat = smoothstep(0.48, 1.0, y);
    const topCooling = 1 - smoothstep(0.0, 0.35, y);
    const convection =
      0.035 * Math.sin(8 * x + 4.2 * y + t * 0.0007) +
      0.018 * Math.sin(15 * (x - y) - t * 0.0011);

    const heater = Number(heatSlider.value);
    return clamp(0.18 + 0.55 * bottomHeat * heater - 0.09 * topCooling + convection, 0.08, 0.98);
  }

  function makeBlob(opts = {}) {
    const y = opts.y ?? rand(0.38, 0.96);
    const r = opts.r ?? rand(0.030, 0.067);
    const hw = lampHalfWidth(y);
    const x = opts.x ?? rand(0.5 - hw * 0.55, 0.5 + hw * 0.55);

    return {
      x,
      y,
      vx: opts.vx ?? rand(-0.015, 0.015),
      vy: opts.vy ?? rand(-0.015, 0.015),
      r,
      // Temperature is normalized: about 0.50 is nearly neutrally buoyant.
      temp: opts.temp ?? clamp(localFluidTemperature(x, y, performance.now()) + rand(-0.12, 0.10), 0.12, 0.92),
      phase: rand(0, TAU),
      age: rand(0, 8),
      mergeLock: 0
    };
  }

  function resetBlobs() {
    const count = Number(countSlider.value);
    blobs = [];
    for (let i = 0; i < count; i++) blobs.push(makeBlob());
  }

  function resize() {
    DPR = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
    W = Math.floor(window.innerWidth * DPR);
    H = Math.floor(window.innerHeight * DPR);

    canvas.width = W;
    canvas.height = H;
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    const lampHeight = Math.min(H * 0.88, W * 1.92);
    const lampWidth = lampHeight * 0.43;
    lamp = {
      w: lampWidth,
      h: lampHeight,
      x: (W - lampWidth) / 2,
      y: (H - lampHeight) / 2 + H * 0.025,
      aspect: lampWidth / lampHeight
    };

    const offH = Math.round(clamp(lampHeight / 3.25, 230, 430));
    const offW = Math.round(offH * lamp.aspect);
    off.width = offW;
    off.height = offH;
    imageData = offCtx.createImageData(offW, offH);
  }

  function physicsStep(dt, now) {
    const heater = Number(heatSlider.value);
    const viscosityControl = Number(viscSlider.value);
    const neutralTemp = 0.505;
    const buoyancy = 1.58;
    const baseDrag = 1.22 * viscosityControl;

    // Per-blob forces.
    for (const b of blobs) {
      b.age += dt;
      b.mergeLock = Math.max(0, b.mergeLock - dt);

      // Heat exchange with the surrounding oil. Bigger blobs heat/cool more slowly.
      const env = localFluidTemperature(b.x, b.y, now);
      const heatExchangeRate = (0.72 + 0.22 * heater) / (1 + b.r * 9.5);
      b.temp += (env - b.temp) * heatExchangeRate * dt;

      // Extra heater contact at bottom and extra cooling near top cap.
      b.temp += heater * 0.29 * smoothstep(0.78, 1.0, b.y) * dt / (1 + b.r * 7.5);
      b.temp -= 0.20 * (1 - smoothstep(0.06, 0.25, b.y)) * dt / (1 + b.r * 7.5);
      b.temp = clamp(b.temp, 0.05, 1.05);

      // Hot wax is less dense, so it rises. Cold wax sinks.
      // y is downward, so upward acceleration is negative.
      const thermalBuoyancy = -buoyancy * (b.temp - neutralTemp);

      // Crude circulation: warm fluid rises near the center; cooler return flow
      // slips downward along the glass.
      const hw = lampHalfWidth(b.y);
      const centerDistance = Math.abs(b.x - 0.5) / Math.max(0.001, hw);
      const centerUpdraft = 1 - smoothstep(0.18, 0.92, centerDistance);
      const wallDowndraft = smoothstep(0.55, 1.0, centerDistance);
      const circulationY = -0.16 * centerUpdraft * heater + 0.13 * wallDowndraft;
      const circulationX =
        0.055 * Math.sin(10 * b.y + b.phase + now * 0.00045) *
        (0.4 + 0.6 * smoothstep(0.20, 0.90, b.y));

      // Temperature-dependent viscosity: cooler wax is stickier.
      const coldDrag = lerp(1.75, 0.58, clamp(b.temp, 0, 1));
      const speed = Math.hypot(b.vx / Math.max(lamp.aspect, 0.01), b.vy);
      const quadraticDrag = 1 + speed * 8.5;

      b.vx += circulationX * dt;
      b.vy += (thermalBuoyancy + circulationY) * dt;

      b.vx -= b.vx * baseDrag * coldDrag * quadraticDrag * dt;
      b.vy -= b.vy * baseDrag * coldDrag * quadraticDrag * dt;

      // Tiny Brownian-looking perturbation prevents dead-still symmetry.
      const jitter = 0.0045 * (1.1 - clamp(b.r * 10, 0, 0.8));
      b.vx += Math.sin(now * 0.0017 + b.phase) * jitter * dt;
      b.vy += Math.cos(now * 0.0013 + b.phase * 1.7) * jitter * dt;

      b.x += b.vx * dt;
      b.y += b.vy * dt;

      constrainToLamp(b, dt);
    }

    // Soft parcel interaction. This is not rigid-body collision; wax can deform,
    // but parcels resist occupying the same core and exchange temperature.
    for (let i = 0; i < blobs.length; i++) {
      const a = blobs[i];
      for (let j = i + 1; j < blobs.length; j++) {
        const b = blobs[j];
        const dx = (b.x - a.x) * lamp.aspect;
        const dy = b.y - a.y;
        const d = Math.hypot(dx, dy) + 1e-6;
        const minD = (a.r + b.r) * 0.72;

        // Thermal conduction between touching or nearly touching wax.
        const near = smoothstep((a.r + b.r) * 2.2, (a.r + b.r) * 0.6, d);
        if (near > 0) {
          const exchange = (b.temp - a.temp) * 0.055 * near * dt;
          a.temp += exchange;
          b.temp -= exchange;
        }

        if (d < minD) {
          const overlap = minD - d;
          const nx = dx / d;
          const ny = dy / d;

          const invAspect = 1 / Math.max(lamp.aspect, 0.01);
          const impulse = overlap * 0.78;
          a.x -= nx * impulse * 0.5 * invAspect;
          b.x += nx * impulse * 0.5 * invAspect;
          a.y -= ny * impulse * 0.5;
          b.y += ny * impulse * 0.5;

          const rvx = (b.vx - a.vx) * lamp.aspect;
          const rvy = b.vy - a.vy;
          const closing = rvx * nx + rvy * ny;
          if (closing < 0) {
            const bounce = -closing * 0.18;
            a.vx -= nx * bounce * invAspect;
            b.vx += nx * bounce * invAspect;
            a.vy -= ny * bounce;
            b.vy += ny * bounce;
          }

          constrainToLamp(a, dt);
          constrainToLamp(b, dt);
        }

        // Physical coalescence: similar-temperature blobs that overlap deeply and
        // move slowly merge. Radius preserves 2D area: r_new^2 = r_a^2 + r_b^2.
        const canMerge =
          blobs.length > 9 &&
          a.mergeLock <= 0 &&
          b.mergeLock <= 0 &&
          d < (a.r + b.r) * 0.34 &&
          Math.abs(a.temp - b.temp) < 0.16 &&
          Math.hypot(a.vx - b.vx, a.vy - b.vy) < 0.11;

        if (canMerge) {
          const areaA = a.r * a.r;
          const areaB = b.r * b.r;
          const area = areaA + areaB;
          a.x = (a.x * areaA + b.x * areaB) / area;
          a.y = (a.y * areaA + b.y * areaB) / area;
          a.vx = (a.vx * areaA + b.vx * areaB) / area;
          a.vy = (a.vy * areaA + b.vy * areaB) / area;
          a.temp = (a.temp * areaA + b.temp * areaB) / area;
          a.r = Math.min(0.105, Math.sqrt(area) * 0.986);
          a.mergeLock = 1.25;
          blobs.splice(j, 1);
          j--;
        }
      }
    }

    // Splitting: large blobs that cool at the top or overheat at the bottom
    // pinch apart under surface-tension instability.
    for (let i = blobs.length - 1; i >= 0; i--) {
      const b = blobs[i];
      const atColdTop = b.y < 0.28 && b.temp < 0.43;
      const atHotBase = b.y > 0.82 && b.temp > 0.72;
      const unstable = b.r > 0.062 && (atColdTop || atHotBase);

      if (unstable && blobs.length < Number(countSlider.value) + 8 && Math.random() < dt * 0.58) {
        const keep = rand(0.48, 0.64);
        const r1 = b.r * Math.sqrt(keep);
        const r2 = b.r * Math.sqrt(1 - keep);
        const angle = rand(0, TAU);
        const sep = (r1 + r2) * 0.48;
        const nx = Math.cos(angle) / Math.max(lamp.aspect, 0.01);
        const ny = Math.sin(angle);

        b.r = r1;
        b.x -= nx * sep * 0.5;
        b.y -= ny * sep * 0.5;
        b.vx -= nx * 0.015;
        b.vy -= ny * 0.015;
        b.mergeLock = 1.1;

        const child = makeBlob({
          x: b.x + nx * sep,
          y: b.y + ny * sep,
          r: r2,
          vx: b.vx + nx * 0.035,
          vy: b.vy + ny * 0.035,
          temp: b.temp + rand(-0.025, 0.025)
        });
        child.mergeLock = 1.1;
        blobs.push(child);
        constrainToLamp(b, dt);
        constrainToLamp(child, dt);
      }
    }

    // If the count drifts too low after coalescence, seed tiny wax drops at the base.
    while (blobs.length < Math.max(7, Number(countSlider.value) - 5)) {
      blobs.push(makeBlob({
        y: rand(0.84, 0.96),
        r: rand(0.026, 0.042),
        temp: rand(0.66, 0.86),
        vy: rand(-0.045, -0.010)
      }));
    }
  }

  function drawLampPath(context) {
    const samples = 48;
    context.beginPath();

    for (let i = 0; i <= samples; i++) {
      const y = i / samples;
      const x = 0.5 - lampHalfWidth(y);
      const px = lamp.x + x * lamp.w;
      const py = lamp.y + y * lamp.h;
      if (i === 0) context.moveTo(px, py);
      else context.lineTo(px, py);
    }

    for (let i = samples; i >= 0; i--) {
      const y = i / samples;
      const x = 0.5 + lampHalfWidth(y);
      context.lineTo(lamp.x + x * lamp.w, lamp.y + y * lamp.h);
    }

    context.closePath();
  }

  function renderMetaballs() {
    const w = off.width;
    const h = off.height;
    const data = imageData.data;
    const aspect = lamp.aspect;

    let p = 0;
    for (let j = 0; j < h; j++) {
      const y = (j + 0.5) / h;
      const hw = lampHalfWidth(y);

      for (let i = 0; i < w; i++, p += 4) {
        const x = (i + 0.5) / w;

        if (Math.abs(x - 0.5) > hw || y < 0.018 || y > 0.988) {
          data[p + 3] = 0;
          continue;
        }

        let field = 0;
        let tempWeighted = 0;

        for (const b of blobs) {
          const dx = (x - b.x) * aspect;
          const dy = y - b.y;
          const d2 = dx * dx + dy * dy + 0.000055;
          const c = (b.r * b.r) / d2;
          field += c;
          tempWeighted += c * b.temp;
        }

        // Threshold is intentionally wide: smooth edges and visible fusion.
        const lava = smoothstep(0.92, 1.52, field);
        if (lava <= 0.001) {
          data[p + 3] = 0;
          continue;
        }

        const temp = clamp(tempWeighted / Math.max(field, 1e-6), 0, 1);
        const core = smoothstep(1.40, 3.60, field);
        const glow = smoothstep(0.82, 1.15, field) * 0.45;

        // Temperature color ramp: cool crimson -> orange -> yellow-white.
        const red = lerp(150, 255, smoothstep(0.10, 0.82, temp));
        const green = lerp(25, 185, Math.pow(clamp(temp, 0, 1), 1.55));
        const blue = lerp(18, 44, 1 - smoothstep(0.35, 1.0, temp));

        data[p] = clamp(red + core * 20 + glow * 18, 0, 255);
        data[p + 1] = clamp(green + core * 25 + glow * 8, 0, 255);
        data[p + 2] = clamp(blue, 0, 255);
        data[p + 3] = clamp((lava * 230 + core * 25), 0, 255);
      }
    }

    offCtx.putImageData(imageData, 0, 0);
  }

  function drawBackground(now) {
    const g = ctx.createRadialGradient(W * 0.5, H * 0.58, 0, W * 0.5, H * 0.58, Math.max(W, H) * 0.75);
    g.addColorStop(0, "#19101f");
    g.addColorStop(0.55, "#080813");
    g.addColorStop(1, "#030305");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Ambient base glow.
    const baseGlow = ctx.createRadialGradient(W * 0.5, lamp.y + lamp.h * 1.02, 0, W * 0.5, lamp.y + lamp.h * 1.02, lamp.w * 1.35);
    baseGlow.addColorStop(0, "rgba(255, 126, 32, 0.35)");
    baseGlow.addColorStop(0.55, "rgba(255, 98, 18, 0.10)");
    baseGlow.addColorStop(1, "rgba(255, 98, 18, 0)");
    ctx.fillStyle = baseGlow;
    ctx.fillRect(0, 0, W, H);

    // Very subtle animated background specks.
    ctx.save();
    ctx.globalAlpha = 0.12;
    for (let i = 0; i < 45; i++) {
      const x = (Math.sin(i * 91.3) * 0.5 + 0.5) * W;
      const y = ((Math.cos(i * 37.1 + now * 0.00003) * 0.5 + 0.5) * H);
      const s = (Math.sin(i * 19.7) * 0.5 + 0.8) * DPR;
      ctx.fillStyle = "rgba(255, 209, 127, 0.7)";
      ctx.fillRect(x, y, s, s);
    }
    ctx.restore();
  }

  function drawLamp(now) {
    // Stand and cap.
    ctx.save();
    ctx.translate(lamp.x + lamp.w * 0.5, 0);

    const baseY = lamp.y + lamp.h * 0.982;
    const topY = lamp.y - lamp.h * 0.016;

    const metal = ctx.createLinearGradient(-lamp.w * 0.42, 0, lamp.w * 0.42, 0);
    metal.addColorStop(0, "#151318");
    metal.addColorStop(0.28, "#4b3829");
    metal.addColorStop(0.48, "#f1a34a");
    metal.addColorStop(0.72, "#5b3c24");
    metal.addColorStop(1, "#100f15");

    ctx.fillStyle = metal;
    roundRect(ctx, -lamp.w * 0.35, baseY, lamp.w * 0.70, lamp.h * 0.095, lamp.w * 0.045);
    ctx.fill();

    ctx.fillStyle = metal;
    roundRect(ctx, -lamp.w * 0.17, topY - lamp.h * 0.05, lamp.w * 0.34, lamp.h * 0.08, lamp.w * 0.025);
    ctx.fill();

    ctx.restore();

    // Glass body.
    ctx.save();
    drawLampPath(ctx);

    const glass = ctx.createLinearGradient(lamp.x, 0, lamp.x + lamp.w, 0);
    glass.addColorStop(0, "rgba(255,255,255,0.05)");
    glass.addColorStop(0.13, "rgba(255,255,255,0.22)");
    glass.addColorStop(0.22, "rgba(255,255,255,0.03)");
    glass.addColorStop(0.80, "rgba(255,255,255,0.04)");
    glass.addColorStop(0.91, "rgba(255,255,255,0.20)");
    glass.addColorStop(1, "rgba(255,255,255,0.03)");

    ctx.fillStyle = "rgba(36, 20, 55, 0.30)";
    ctx.fill();

    ctx.save();
    ctx.clip();

    // Oil color and slight thermal gradient.
    const oil = ctx.createLinearGradient(0, lamp.y, 0, lamp.y + lamp.h);
    oil.addColorStop(0, "rgba(46, 32, 88, 0.64)");
    oil.addColorStop(0.58, "rgba(28, 20, 48, 0.54)");
    oil.addColorStop(1, "rgba(89, 38, 26, 0.72)");
    ctx.fillStyle = oil;
    ctx.fillRect(lamp.x, lamp.y, lamp.w, lamp.h);

    // Metaball image. Draw blurred glow first, then sharp lava.
    renderMetaballs();
    ctx.imageSmoothingEnabled = true;

    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.55;
    ctx.filter = `blur(${Math.max(9, 12 * DPR)}px)`;
    ctx.drawImage(off, lamp.x, lamp.y, lamp.w, lamp.h);

    ctx.globalAlpha = 1;
    ctx.filter = "none";
    ctx.drawImage(off, lamp.x, lamp.y, lamp.w, lamp.h);
    ctx.globalCompositeOperation = "source-over";

    // Heater coil glow.
    const heatPower = Number(heatSlider.value);
    const heater = ctx.createRadialGradient(
      lamp.x + lamp.w * 0.5,
      lamp.y + lamp.h * 0.94,
      0,
      lamp.x + lamp.w * 0.5,
      lamp.y + lamp.h * 0.94,
      lamp.w * (0.22 + 0.10 * heatPower)
    );
    heater.addColorStop(0, `rgba(255, 220, 90, ${0.26 + 0.15 * heatPower})`);
    heater.addColorStop(0.40, `rgba(255, 105, 32, ${0.22 + 0.12 * heatPower})`);
    heater.addColorStop(1, "rgba(255, 105, 32, 0)");
    ctx.fillStyle = heater;
    ctx.fillRect(lamp.x, lamp.y + lamp.h * 0.68, lamp.w, lamp.h * 0.34);

    ctx.restore();

    // Glass highlights and outline.
    drawLampPath(ctx);
    ctx.fillStyle = glass;
    ctx.fill();

    drawLampPath(ctx);
    ctx.strokeStyle = "rgba(255, 231, 176, 0.22)";
    ctx.lineWidth = Math.max(1, 1.25 * DPR);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(lamp.x + lamp.w * 0.38, lamp.y + lamp.h * 0.09);
    ctx.bezierCurveTo(
      lamp.x + lamp.w * 0.22, lamp.y + lamp.h * 0.33,
      lamp.x + lamp.w * 0.24, lamp.y + lamp.h * 0.66,
      lamp.x + lamp.w * 0.35, lamp.y + lamp.h * 0.90
    );
    ctx.strokeStyle = "rgba(255,255,255,0.20)";
    ctx.lineWidth = Math.max(1, 1.8 * DPR);
    ctx.stroke();

    // Bottom liquid meniscus.
    ctx.beginPath();
    ctx.ellipse(
      lamp.x + lamp.w * 0.5,
      lamp.y + lamp.h * 0.934,
      lamp.w * 0.252,
      lamp.h * 0.016,
      0,
      0,
      TAU
    );
    ctx.strokeStyle = "rgba(255, 190, 92, 0.18)";
    ctx.lineWidth = Math.max(1, 1.2 * DPR);
    ctx.stroke();

    ctx.restore();
  }

  function roundRect(context, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    context.beginPath();
    context.moveTo(x + r, y);
    context.arcTo(x + w, y, x + w, y + h, r);
    context.arcTo(x + w, y + h, x, y + h, r);
    context.arcTo(x, y + h, x, y, r);
    context.arcTo(x, y, x + w, y, r);
    context.closePath();
  }

  function updateStats(dt) {
    if (frame % 9 !== 0) return;

    let avgTemp = 0;
    let energy = 0;
    for (const b of blobs) {
      avgTemp += b.temp;
      energy += 0.5 * (b.vx * b.vx + b.vy * b.vy) * b.r * b.r * 1000;
    }
    avgTemp /= Math.max(1, blobs.length);

    statTemp.textContent = `temp: ${avgTemp.toFixed(3)}`;
    statFPS.textContent = `fps: ${fpsSmooth.toFixed(0)}`;
    statBlob.textContent = `blobs: ${blobs.length}`;
    statEnergy.textContent = `energy: ${energy.toFixed(3)}`;
  }

  function animate(now) {
    const rawDt = clamp((now - lastTime) / 1000, 0.001, 0.045);
    lastTime = now;
    fpsSmooth = lerp(fpsSmooth, 1 / rawDt, 0.06);

    if (!paused) {
      // Substepping keeps forces stable when frames hitch.
      const substeps = rawDt > 0.025 ? 3 : 2;
      const dt = rawDt / substeps;
      for (let i = 0; i < substeps; i++) physicsStep(dt, now + i * dt * 1000);
    }

    drawBackground(now);
    drawLamp(now);
    updateStats(rawDt);
    frame++;

    requestAnimationFrame(animate);
  }

  function pointerToLamp(event) {
    const rect = canvas.getBoundingClientRect();
    const clientX = event.clientX ?? event.touches?.[0]?.clientX;
    const clientY = event.clientY ?? event.touches?.[0]?.clientY;
    const px = (clientX - rect.left) * DPR;
    const py = (clientY - rect.top) * DPR;
    return {
      x: (px - lamp.x) / lamp.w,
      y: (py - lamp.y) / lamp.h
    };
  }

  function injectBlob(event) {
    const p = pointerToLamp(event);
    if (!insideLamp(p.x, p.y, 0.035)) return;

    const r = rand(0.028, 0.048);
    blobs.push(makeBlob({
      x: p.x,
      y: p.y,
      r,
      temp: clamp(localFluidTemperature(p.x, p.y, performance.now()) + 0.34, 0.48, 1.0),
      vx: rand(-0.045, 0.045),
      vy: rand(-0.18, -0.04)
    }));

    // Keep simulation bounded by removing the smallest coldest drop if needed.
    const max = Number(countSlider.value) + 12;
    if (blobs.length > max) {
      let best = 0;
      let score = Infinity;
      for (let i = 0; i < blobs.length; i++) {
        const s = blobs[i].r * blobs[i].r + blobs[i].temp * 0.002;
        if (s < score) {
          score = s;
          best = i;
        }
      }
      blobs.splice(best, 1);
    }
  }

  function syncControls() {
    heatOut.textContent = `${Number(heatSlider.value).toFixed(2)}×`;
    viscOut.textContent = `${Number(viscSlider.value).toFixed(2)}×`;
    countOut.textContent = countSlider.value;
  }

  heatSlider.addEventListener("input", syncControls);
  viscSlider.addEventListener("input", syncControls);
  countSlider.addEventListener("input", syncControls);
  countSlider.addEventListener("change", resetBlobs);

  pauseButton.addEventListener("click", () => {
    paused = !paused;
    pauseButton.textContent = paused ? "Resume" : "Pause";
  });

  resetButton.addEventListener("click", resetBlobs);
  canvas.addEventListener("pointerdown", injectBlob);

  window.addEventListener("resize", resize, { passive: true });

  resize();
  syncControls();
  resetBlobs();
  requestAnimationFrame((t) => {
    lastTime = t;
    requestAnimationFrame(animate);
  });
})();
</script>
</body>
</html>
